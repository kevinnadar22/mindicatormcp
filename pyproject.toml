[project]
name = "mindicatormcp"
version = "0.1.0"
description = "FastMCP server for Mumbai Mindicator SQLite data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.4.7",
    "loguru>=0.7.3",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
demo = [
    "smolagents[mcp,openai]",
    "ipykernel",
    "python-dotenv",
]

[project.scripts]
mindicator-mcp = "app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
